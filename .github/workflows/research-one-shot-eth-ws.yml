name: Research ETH WS one-shot observation (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/read-only-mark-provenance-probe-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm research ref and immutable checkout
        env:
          EXPECTED_REF: refs/heads/research/read-only-mark-provenance-probe-20261121
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned and hash-verified WS dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/mark_probe_requirements.txt
      - name: Offline one-shot diagnostic tests
        run: |
          python -m unittest discover -s tests -p 'test_one_shot_ws_observation.py' -v
      - name: One read-only ETH activeAssetCtx session (30 seconds maximum in client)
        run: |
          python scripts/one_shot_ws_observation.py
