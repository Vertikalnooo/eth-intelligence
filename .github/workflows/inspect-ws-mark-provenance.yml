name: Inspect ETH WS mark timestamp provenance (read-only)

on:
  push:
    branches:
      - test/ws-mark-timestamp-provenance-20261120
    paths:
      - '.github/workflows/inspect-ws-mark-provenance.yml'
      - 'scripts/inspect_ws_mark_provenance.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/read-only-mark-provenance-probe-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm approved research ref
        env:
          EXPECTED_REF: refs/heads/research/read-only-mark-provenance-probe-20261121
        run: |
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install hash-verified diagnostic dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r scripts/mark_probe_requirements.txt
      - name: Offline diagnostic tests
        run: python -m unittest discover -s tests -p 'test_mark_provenance_probe.py' -v
      - name: Inspect ETH mark field structure (no trading)
        run: python scripts/inspect_mark_timestamp_live.py
