name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline network fence
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: python scripts/check_offline_network_guard.py
      - name: Run complete offline test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/offline_guard
        run: python -m unittest discover -s tests -v
