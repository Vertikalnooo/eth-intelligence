name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download approved PyPI wheels
        run: |
          python -m pip --isolated download --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/ei-wheels" -r research/requirements-production.lock
          sha256sum "$RUNNER_TEMP"/ei-wheels/*.whl
      - name: Install locked official npm packages
        working-directory: research/cloudflare-witness
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          node -e 'const l=require("./package-lock.json");for(const [p,v] of Object.entries(l.packages)){if(p&&(!v.resolved?.startsWith("https://registry.npmjs.org/")||!v.integrity))throw Error("unlocked dependency: "+p)}'
          npm ci --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Full Python and cross-provider tests offline
        run: |
          PYTHON="$(command -v python)"
          NODE="$(command -v node)"
          sudo unshare --net -- bash -eu -c '
            ip link set lo up
            ip -brief link
            test "$(ip -o link show | wc -l)" -eq 1
            exec sudo -u "$1" env GITHUB_ACTIONS=true EI_NODE="$5" PYTHONPATH="$2/scripts/offline_guard" "$3" "$2/scripts/run_offline_dependencies.py" "$4"
          ' _ "$(id -un)" "$GITHUB_WORKSPACE" "$PYTHON" "$RUNNER_TEMP/ei-wheels" "$NODE"
