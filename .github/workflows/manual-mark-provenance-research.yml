name: Read-only mark provenance research (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install WebSocket client for diagnostic probe
        run: python -m pip install 'websocket-client==1.8.0'
      - name: Inspect ETH mark field structure (no trading)
        run: python scripts/inspect_mark_timestamp_live.py
