name: Read-only mark provenance research (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: ''
      - name: Install diagnostic dependency (pinned)
        run: python -m pip install --disable-pip-version-check 'websocket-client==1.8.0'
      - name: Offline diagnostic tests
        run: python -m unittest discover -s tests -p 'test_mark_provenance_probe.py' -v
      - name: Inspect ETH mark field structure (no trading)
        run: python scripts/inspect_mark_timestamp_live.py
