name: Cloudflare witness offline
on:
  push:
    branches: ['research/stage2-cloudflare-witness', 'research/stage2-cross-provider-recovery']
  pull_request:
    paths: ['research/cloudflare-witness/**', '.github/workflows/cloudflare-witness-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/cloudflare-witness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked official npm packages
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: |
          node -e 'const l=require("./package-lock.json");for(const [p,v] of Object.entries(l.packages)){if(p&&(!v.resolved?.startsWith("https://registry.npmjs.org/")||!v.integrity))throw Error("unlocked dependency: "+p)}'
          npm ci --no-audit --no-fund
          npm ls wrangler miniflare workerd
          git diff --exit-code -- package-lock.json
      - name: Audit locked dependencies against official npm advisory service
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/ei-npm-audit.json"
          rc=$?
          set -e
          node -e 'const a=require(process.argv[1]);console.log(JSON.stringify({metadata:a.metadata,vulnerabilities:a.vulnerabilities,error:a.error},null,2));if(!a.metadata||a.error)process.exit(2)' "$RUNNER_TEMP/ei-npm-audit.json"
          echo "NPM_AUDIT_EXIT=$rc"
        continue-on-error: true
      - name: Run workerd and SQLite tests in isolated network namespace
        run: |
          NODE="$(command -v node)"
          sudo unshare --net -- bash -eu -c '
            ip link set lo up
            ip -brief link
            test "$(ip -o link show | wc -l)" -eq 1
            exec sudo -u "$1" env WRANGLER_SEND_METRICS=false "$2" --test --test-concurrency=1 test/*.test.mjs
          ' _ "$(id -un)" "$NODE"
